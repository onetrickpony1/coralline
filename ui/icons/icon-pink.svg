<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Coralline">
  <!-- Coralline icon: the psi of psychology, whose stem ends in the hook of JASP's J, on a glass tile.
       Drawn by hand in code; rendered to the app icons by tools/make-icons.sh. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8fbb"/>
      <stop offset="0.55" stop-color="#ec4d8e"/>
      <stop offset="1" stop-color="#c92a6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4eeff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the glass tile -->
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#glow)"/>
  <path d="M280 64h464c119 0 216 97 216 216v52c-130 70-300 104-448 104S194 402 64 332v-52C64 161 161 64 280 64z" fill="url(#sheen)"/>
  <rect x="70" y="70" width="884" height="884" rx="210" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <!-- three APA rules: above the headings, below them, and closing the table -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-linecap="round">
    <path d="M196 236h632" stroke-width="10"/>
    <path d="M196 812h632" stroke-width="10"/>
  </g>

  <!-- psi: the bowl, and a stem that ends in the J of JASP -->
  <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop)">
    <path d="M300 330c0 178 78 262 212 262s212-84 212-262" stroke-width="78"/>
    <path d="M512 196v518c0 74-40 112-104 112c-38 0-66-14-86-38" stroke-width="78"/>
  </g>
</svg>
