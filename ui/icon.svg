<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Coralline">
  <!-- Coralline icon: the Dingli cliff as an area chart. The land rests on a faint y axis, rises to the cliff edge and drops sheer: a coralline limestone cap over a clay slope that runs into the sea, whose surface is the x axis. Hand-tuned 16, 24 and 32 px versions are in ui/icon-small/. Rendered by tools/make-icons.sh. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4f8dff"/>
      <stop offset="0.55" stop-color="#2f62ea"/>
      <stop offset="1" stop-color="#1d45c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4eeff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inside"><rect x="64" y="64" width="896" height="896" rx="216"/></clipPath>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4ecdc"/>
    </linearGradient>
    <clipPath id="clear"><rect x="218.5" y="0" width="805.5" height="737.5"/></clipPath>
  </defs>

  <!-- the glass tile -->
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#glow)"/>
  <path d="M280 64h464c119 0 216 97 216 216v52c-130 70-300 104-448 104S194 402 64 332v-52C64 161 161 64 280 64z" fill="url(#sheen)"/>
  <rect x="70" y="70" width="884" height="884" rx="210" fill="none" stroke="url(#rim)" stroke-width="12"/>

  <!-- the sea below the waterline -->
  <path d="M40 744H990V1000H40Z" fill="#ffffff" fill-opacity="0.16" clip-path="url(#inside)"/>

  <!-- the cliff, an area chart sitting on its axes: the sheer coralline cap with two cracks, the clay slope below it
       and one fallen block, both resting on the waterline; the shadow stops short of the axes -->
  <g clip-path="url(#clear)">
    <g filter="url(#drop)">
    <clipPath id="solid6"><path d="M218.5 590H702V612C758 638 816 684 868 737.5H218.5Z"/></clipPath>
    <rect x="64" y="64" width="896" height="896" fill="url(#tile)" clip-path="url(#solid6)"/>
    <path d="M218.5 590H702V612C758 638 816 684 868 737.5H218.5Z" fill="#ffffff" class="clay" fill-opacity="0.5"/>
    <clipPath id="solid7"><path d="M800 737.5L806 708L832 698L846 737.5Z"/></clipPath>
    <rect x="64" y="64" width="896" height="896" fill="url(#tile)" clip-path="url(#solid7)"/>
    <path d="M800 737.5L806 708L832 698L846 737.5Z" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M218.5 399C330 392 450 374 560 354C610 345 640 338 666 332Q684 328 686 344L676 384L696 400L688 470L708 488L700 612H218.5Z" fill="url(#cap)"/>
    </g>
  </g>
  <path d="M600 394L602 446L595 458L597 482M646 486L645 514L657 530L656 566" fill="none" stroke="#8a94a8" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round" stroke-linejoin="miter"/>

  <!-- the faint graph axes on bare tile: y up the left, x along the waterline, ticks outside -->
  <path d="M212 262V744H896 M212 296h-30M212 440h-30M212 600h-30 M392 744v30M572 744v30M752 744v30" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
