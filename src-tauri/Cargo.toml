[package]
name = "coralline"
version = "0.2.0"
description = "Copies the tables in a saved JASP file as APA 7 tables, ready to paste into Word or Google Docs"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"  # Tauri 2 needs 1.90

[lib]
name = "coralline_lib"  # not "coralline": on Windows the library and the program would write the same .pdb file
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coralline"
path = "src/main.rs"

[features]
default = ["app"]
# The app window. The .jasp reader builds and tests without it: `cargo test --no-default-features`.
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:arboard", "dep:gtk", "dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }  # JASP files can hold numbers beyond f64 (1e400)
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

tauri = { version = "2", features = ["image-png"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"], optional = true }  # image-data: "Copy picture only" for figures

[target.'cfg(windows)'.dependencies]
# The same version Tauri uses: the taskbar icon (WM_SETICON) and the Start menu shortcut's icon follow the theme
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by Tauri; needed to change the window's Wayland app id so the taskbar icon follows the theme
gtk = { version = "0.18", optional = true }
